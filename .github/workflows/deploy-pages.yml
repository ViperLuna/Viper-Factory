name: Deploy to GitHub Pages

on:
  push:
    # This repo's default branch is claude/plastic-factory-game-217pgm, not
    # main (GitHub picks the first branch ever pushed as the default when a
    # repo is created without an initial commit). Deploy from whichever one
    # is actually in use so a plain push always publishes.
    branches: [main, claude/plastic-factory-game-217pgm]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
